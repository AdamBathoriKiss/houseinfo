name: HouseInfo Development Test
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true  # először ne bukjon el emiatt
      
      - name: Run tests
        run: npm test
        if: hashFiles('**/*.test.*') != ''  # csak ha vannak tesztek
      
      - name: Build check
        run: npm run build